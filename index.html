<template id="specs-en">
<h3>Overview</h3><p>Robot Karol is a single-file HTML game for kids. The player builds a program from visual blocks; a robot (Karol) runs it on a tile map: it walks, pushes crates, picks up keys, unlocks doors and must reach the exit. Target: a standalone project later (map editor planned).</p>
<h3>Layout</h3><ul><li>Left: block library (collapsible <i>Blocks</i> and <i>Custom blocks</i>), the program panel (or custom-block editor), speed buttons and Run/Step/Stop/Reset/Clear.</li><li>Right: top bar with inventory and the <i>Levels</i> and <i>Specs</i> buttons, the live canvas map, and a status bar under the map.</li><li>On narrow screens the layout stacks vertically.</li></ul>
<h3>Map</h3><ul><li>Maps are arrays of text rows, any size (default level is 15x15), drawn on a canvas scaled to fit. Short rows are padded with spaces.</li><li>Symbols: <code>W</code>/<code>w</code> wall, space floor, <code>K</code> Karol start (facing east), <code>k</code> key, <code>b</code> crate, <code>D</code>/<code>d</code> open door, <code>L</code> locked door, <code>e</code> exit.</li><li>Rooms are detected by flood fill (walls and doors separate rooms) and each room gets its own floor colours. Locked doors show a lock, the exit a flag.</li></ul>
<h3>Robot rules</h3><ul><li>Karol moves one cell per <i>Move forward</i> and turns 90 degrees counter-clockwise per <i>Turn left</i>; movement and rotation are animated.</li><li>Walls and locked doors block (error, program stops). Open doors are passable.</li><li>Walking into a crate pushes it one cell if the cell behind is free floor or door (no wall, locked door, key, exit or other crate); otherwise error "crate is stuck".</li><li>Stepping on a key picks it up into the first free inventory slot (if full, the key stays and a message is shown).</li><li>Reaching the exit wins: after a short pause a "Good job" dialog offers <b>Next level</b> (loads the next level with an empty program; hidden on the last level), <b>Stay</b> (resets the robot, keeps the program for editing) and <b>Restart</b> (resets the robot and clears the program). Closing the dialog leaves everything as is.</li></ul>
<h3>Inventory</h3><p>8 slots shown as an array above the map, numbered 1-8. Items fill the first free index. <i>Use item N</i> applies slot N to the cell directly in front of Karol. A key used on a locked door opens it (door becomes passable) and the key is consumed. Empty slot or no valid target = non-fatal error.</p>
<h3>Blocks</h3><ul><li><b>Turn left</b>, <b>Move forward</b>, <b>Use item [N]</b> (N 1-8), <b>Repeat [N] times</b> (N 1-99, holds nested blocks, can be nested), <b>If</b>, <b>Repeat while</b> and <b>Not</b> (see Sensors; they can also be nested and used in custom blocks).</li><li>Program runs top to bottom between START and END.</li><li>Drag from the library into the program; the drop position is previewed live with a dashed placeholder and neighbours shift (live sorting, also inside Repeat). Drag existing blocks to reorder; while dragging, a semi-transparent remove area covers the map: drop a block there to delete it (dropping a block anywhere else outside the program returns it to where it was). The program list has extra space under END so the last position is easy to hit. A block that was just added or moved glows and fades back to normal over 2 seconds. Short sounds play when a block is added, moved or deleted. Works with mouse and touch (pointer events).</li></ul>
<h3>Sensors and conditions</h3><ul><li>The expandable <i>Sensors</i> section (above Blocks) holds sensor blocks, which are yes/no questions about the world. Sensor <b>Can go forward</b> is true when <i>Move forward</i> would succeed: the cell ahead is not a wall or locked door, and a crate there could be pushed.</li><li><b>If [sensor]</b> runs the blocks inside only when the sensor is true (no else branch). <b>Repeat while [condition]</b> repeats its blocks as long as the condition is true (checked before each round), e.g. Repeat while Can go forward: Move forward walks up to the wall. <b>Not ( [condition] )</b> (in the Blocks section) is an operator that turns true into false and vice versa. It fits any condition slot and has a slot of its own, e.g. Repeat while Not(Can go forward): Turn left turns until the way is free. Not blocks can be nested.</li><li>Drag a sensor into the <code>?</code> condition slot of If / Repeat while / Not (slots are highlighted while dragging; dropping a new sensor replaces the old one; a sensor can be dragged out to the remove area). An empty slot is an error (red dot).</li><li>Each condition check is its own execution step: the If / Repeat while block lights up and the status bar shows "Can go forward? yes/no". Loops whose body changes nothing stop with an error instead of running forever.</li></ul>
<h3>Custom blocks</h3><ul><li><b>Create</b> opens the editor view (map faded, run controls disabled): name field, block list, Save and Cancel.</li><li>A custom block is a function that can contain any blocks including other custom blocks. Cycles are prevented (a block cannot contain itself or a block that contains it); execution depth is capped at 20.</li><li>Library rows have edit and delete (delete asks "Sure?" and removes all usages). Renaming updates existing usages. An empty name gets "Block N".</li><li><b>Select mode</b> in the program header: click adjacent blocks of one list to select them, then <i>Make block</i> opens the editor prefilled; Save replaces the selection with the new custom block, Cancel leaves the program unchanged.</li><li>Custom blocks live in memory only (not persisted yet).</li></ul>
<h3>Execution</h3><ul><li><b>Run</b> (F5) executes with a timer and turns into <b>Pause</b> (F5) while the program is running; Run again continues from where it paused, <b>Step</b> (F6) executes one instruction (continue with Run any time), <b>Stop</b> (Esc; if a dialog is open Esc closes the dialog instead) ends, <b>Reset</b> returns the level to its start, <b>Clear</b> empties the program.</li><li>Speed: 1x, 3x, 5x, 15x (base 450 ms per instruction); also affects animation.</li><li>Execution pointer: while running or stepping, a red arrow ▶ in front of the row and a yellow outline mark the block being executed right now (inside loops it jumps back each round). A <i>Repeat N times</i> block is a step of its own at the start of every round (and once more when the loop ends): the arrow points at it, and its badge ⏳ next to the original N counts down the rounds left (N, N-1, ... 0) with a small pop animation. The badge, like the dots, stays until the next run or program change. Loops inside custom blocks have no badge or extra steps.</li><li>Sonar: whenever a sensor is evaluated, Karol sends a short sonar animation in his facing direction: a fan-shaped beam with expanding arcs, ending in a ping ring on the cell ahead, green when the sensor sees a free cell and red when it is blocked (its length follows the speed setting and it always ends before the next block executes; in single-step mode it plays a bit longer).</li><li>Safety limits: 5000 execution steps per run and 200000 loop rounds, then the run stops with a message.</li><li>Status dots: the running block is green; every executed block keeps a green dot, failed or non-executable blocks get a red dot (red wins). Dots clear on the next run or any program change. A custom block call is marked as a whole.</li></ul>
<h3>Levels</h3><ul><li>The <i>Levels</i> button lists levels; click one to load it. The current level is restored on reload.</li><li>Built-in levels: Level 1 (straight walk), Level 2 (spiral corridor), Level 3 (door, key and locked door), Level 4 (a wall of crates to push), Level 5 (key, crate and locked door), Level 6 (long spiral maze), Level 7 (diagonal staircase corridor). Built-in levels are versioned (<code>karol.ver</code> = 5): on first load of this version they replace stored levels with the same id, and other stored levels are kept after them.</li><li>Level format: <code>{"id":"level-1","name":"...","map":["WWW","W K", ...]}</code>.</li><li>Stored in <code>localStorage</code> keys <code>karol.levels</code> and <code>karol.level</code> (guarded with try/catch; falls back to memory).</li><li>Console API: <code>exportLevels()</code> (also exposed on the parent/top window when allowed; in a sandboxed iframe select the iframe in the DevTools console context dropdown) prints the levels JSON and returns the array; <code>importLevels(levels)</code> accepts an array or JSON string, validates (each needs a map with exactly one <code>K</code>), merges by id (same id replaced, new appended) and saves. Returns the number imported.</li></ul>
<h3>Options and language</h3><p>The <i>Options</i> button (after Specs) opens a menu with the language switch: English or Slovak (Slovenčina). It translates the whole interface (labels, blocks, messages); the specs themselves stay English only. The choice is stored in <code>localStorage</code> key <code>karol.lang</code>; the default follows the browser language. User-entered names (custom blocks, levels) are not translated.</p>
<p>Options also has a Sound on/off switch (<code>localStorage</code> key <code>karol.sound</code>).</p>
<h3>Technical notes</h3><ul><li>One HTML file, no dependencies; DOM for blocks, canvas for the map. Program is read from the DOM into a tree and interpreted lazily by a generator, one action or condition check per tick, so sensors always see the live robot state.</li><li>Planned: map editor, persistence of custom blocks.</li></ul>
<h3>Maintenance rule</h3><p>These specs must be updated with every change so they always describe the current solution.</p>
</template>

let MAP;

let grid,boxes,R,inv,speed=1,angle,rx,ry,ra;
let roomMap=[];let sonar=null;
function ping(c){let l=c;while(l&&l.t==='not')l=l.c;const f=l&&SENS[l.t];sonar={t0:performance.now(),ok:f?!!f():false,dur:running?Math.max(60,380/speed):700}}
function reset(){
 ROWS=MAP.length;COLS=Math.max(...MAP.map(r=>r.length));
 grid=MAP.map(r=>r.padEnd(COLS).split('').map(c=>c==='w'?'W':c==='d'?'D':c));boxes=new Set();R={x:1,y:1,d:1};
 grid.forEach((r,y)=>r.forEach((c,x)=>{if(c==='b'){boxes.add(x+','+y);r[x]=' '}if(c==='K'){R={x,y,d:1};r[x]=' '}}));
 roomMap=grid.map(r=>r.map(()=>-1));let n=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  if(roomMap[y][x]>=0||'WDLO'.includes(grid[y][x]))continue;
  const q=[[x,y]];roomMap[y][x]=n;
  while(q.length){const[cx,cy]=q.pop();for(let d=0;d<4;d++){const nx=cx+DX[d],ny=cy+DY[d];
   if(nx<0||ny<0||nx>=COLS||ny>=ROWS||roomMap[ny][nx]>=0||'WDLO'.includes(grid[ny][nx]))continue;roomMap[ny][nx]=n;q.push([nx,ny])}}
  n++}
 inv=Array(8).fill(null);angle=R.d*90;rx=R.x;ry=R.y;ra=angle;ui();
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const PAL=[['#d6ecff','#c4e2ff'],['#fff1c9','#ffe8a8'],['#d9f7e2','#c6f0d3'],['#ffe3f0','#ffd0e6'],['#eadfff','#dccbff']];
function floorCol(x,y){const id=roomMap[y][x];return id<0?'#e9e4d6':PAL[id%5][(x+y)%2]}
function frame(){
 const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#4a4e8a';ctx.fillRect(0,0,w,h);
 const s=Math.min(w/COLS,h/ROWS),ox=(w-s*COLS)/2,oy=(h-s*ROWS)/2;
 ctx.translate(ox,oy);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(s*.7)+'px serif';
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const c=grid[y][x],px=x*s,py=y*s;
  if(c==='W'){ctx.fillStyle='#7a5c9e';ctx.fillRect(px,py,s,s);ctx.fillStyle='#9a7cc0';ctx.fillRect(px,py,s,s*.45);
   ctx.strokeStyle='#5e4580';ctx.lineWidth=1;ctx.strokeRect(px+.5,py+.5,s-1,s-1);continue}
  ctx.fillStyle=floorCol(x,y);ctx.fillRect(px,py,s,s);
  if(c==='D'||c==='O'){ctx.fillStyle='#c98f4f';ctx.fillRect(px+s*.1,py,s*.8,s);ctx.fillStyle='#e8b57a';ctx.fillRect(px+s*.2,py+s*.1,s*.6,s*.8)}
  if(c==='L'){ctx.fillStyle='#d94b4b';ctx.fillRect(px,py,s,s);ctx.fillStyle='#fff';ctx.fillText('🔒',px+s/2,py+s/2)}
  if(c==='k')ctx.fillText('🔑',px+s/2,py+s/2);
  if(c==='e'){ctx.fillStyle='#7ee0a0';ctx.fillRect(px,py,s,s);ctx.fillText('🏁',px+s/2,py+s/2)}
 }
 boxes.forEach(b=>{const[x,y]=b.split(',').map(Number),p=s*.1;
  ctx.fillStyle='#b9772f';ctx.fillRect(x*s+p,y*s+p,s-2*p,s-2*p);ctx.strokeStyle='#7a4a16';ctx.lineWidth=Math.max(2,s*.08);
  ctx.strokeRect(x*s+p,y*s+p,s-2*p,s-2*p);ctx.beginPath();ctx.moveTo(x*s+p,y*s+p);ctx.lineTo(x*s+s-p,y*s+s-p);ctx.moveTo(x*s+s-p,y*s+p);ctx.lineTo(x*s+p,y*s+s-p);ctx.stroke()});
 const k=1-Math.pow(.75,speed);rx+=(R.x-rx)*k;ry+=(R.y-ry)*k;ra+=(angle-ra)*k;
 ctx.save();ctx.translate((rx+.5)*s,(ry+.5)*s);ctx.rotate(ra*Math.PI/180);
 const u=s/10;ctx.fillStyle='#1d6fe0';ctx.beginPath();ctx.roundRect(-3.6*u,-3.6*u,7.2*u,7.2*u,2*u);ctx.fill();
 ctx.fillStyle='#8fc1ff';ctx.beginPath();ctx.roundRect(-2.6*u,-3*u,5.2*u,3.4*u,u);ctx.fill();
 ctx.fillStyle='#fff';[-1.2,1.2].forEach(e=>{ctx.beginPath();ctx.arc(e*u,-1.5*u,.8*u,0,7);ctx.fill()});
 ctx.fillStyle='#ffd60a';ctx.beginPath();ctx.moveTo(0,-4.9*u);ctx.lineTo(1.4*u,-3.6*u);ctx.lineTo(-1.4*u,-3.6*u);ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(-2*u,1*u,4*u,1.2*u);
 if(sonar){const t=performance.now()-sonar.t0,tot=sonar.dur;
  if(t>tot)sonar=null;else{
   const col=sonar.ok?'80,220,120':'255,90,90',oy=-3.6*u,L=s*1.15,half=.62,fade=1-t/tot;
   ctx.save();ctx.lineCap='round';
   const g=ctx.createRadialGradient(0,oy,0,0,oy,L);g.addColorStop(0,'rgba('+col+',.35)');g.addColorStop(1,'rgba('+col+',0)');
   ctx.globalAlpha=fade;ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,oy);ctx.arc(0,oy,L,-Math.PI/2-half,-Math.PI/2+half);ctx.closePath();ctx.fill();
   for(let i=0;i<3;i++){const p=(t-i*.18*sonar.dur)/(.6*sonar.dur);if(p<=0||p>=1)continue;
    ctx.globalAlpha=(1-p)*.9;ctx.strokeStyle='rgb('+col+')';ctx.lineWidth=Math.max(2,s*.06);
    ctx.beginPath();ctx.arc(0,oy,p*L,-Math.PI/2-half,-Math.PI/2+half);ctx.stroke()}
   const q=(t-.45*sonar.dur)/(.55*sonar.dur);
   if(q>0&&q<1){ctx.globalAlpha=1-q;ctx.strokeStyle='rgb('+col+')';ctx.lineWidth=Math.max(2,s*.07);
    ctx.beginPath();ctx.arc(0,-s,s*(.15+.35*q),0,7);ctx.stroke();ctx.fillStyle='rgba('+col+',.4)';ctx.beginPath();ctx.arc(0,-s,s*.05+s*.15*(1-q),0,7);ctx.fill()}
   ctx.restore()}}

}

function mk(t,id){
 const b=document.createElement('div');b.className='block '+t;b.dataset.type=t;
 if(t==='not'){b.className='block sensor not';b.innerHTML='🚫 '+sp('b.not')+' ( <span class="cond"></span> )'}

const inp=b=>b.querySelector(':scope > input, :scope > .hd > input');
function ser(list,keepEl){return serEls([...list.children].filter(c=>c.classList.contains('block')),keepEl)}
function serEls(els,keepEl){return els.map(c=>{
 const t=c.dataset.type,i=inp(c),o={t,id:c.dataset.id,n:i?+i.value:undefined};
 if(keepEl)o.el=c;if(t==='for'||t==='if'||t==='while'){o.ch=ser(c.querySelector('.list'),keepEl);if(t!=='for')o.cond=serCond(c.querySelector(':scope > .hd > .cond'))}return o})}
function build(arr,list){for(const i of arr){const b=mk(i.t,i.id);if(i.n!=null&&inp(b))inp(b).value=i.n;list.appendChild(b);if(i.ch)build(i.ch,b.querySelector('.list'));if(i.cond)buildCond(i.cond,b.querySelector('.cond'))}}
function serCond(slot){const q=slot&&slot.querySelector(':scope > .block');if(!q)return null;const t=q.dataset.type;return t==='not'?{t,c:serCond(q.querySelector(':scope > .cond'))}:{t}}

function uses(arr,t,seen){for(const i of arr){

  const e=document.createElement('button');e.className='mini';e.textContent='✏️';e.title='Edit';e.onclick=()=>openEditor(id);

 if(!fromLib)b.parentNode.insertBefore(ph,b);

 document.body.classList.add('dragging');document.body.classList.toggle('dragging-sensor',el.classList.contains('sensor'));
 drag={el,ph,fromLib,home,trash:false,ox:e.clientX-r.left,oy:e.clientY-r.top};move(e);
});
function move(e){
 if(!drag)return;const{el,ph}=drag;
 el.style.left=(e.clientX-drag.ox)+'px';el.style.top=(e.clientY-drag.oy)+'px';
 const u=document.elementFromPoint(e.clientX,e.clientY);
 drag.trash=!!(u&&u.closest('#trash'));trashEl.classList.toggle('hot',drag.trash);
 document.querySelectorAll('.cond.hot').forEach(x=>x.classList.remove('hot'));drag.cond=null;
 if(drag.trash){ph.remove();return}
 if(el.classList.contains('sensor')){
  const c=u&&u.closest('.cond'),p=c&&c.closest('.sch');
  if(p&&p.style.display!=='none'){drag.cond=c;c.classList.add('hot')}return}
 let list=u&&u.closest('.sch .list');
 if(!list){const sc=u&&u.closest('#scheme,#fscheme');if(sc&&sc.closest('.sch').style.display!=='none')list=sc.querySelector('.list')}
 if(!list)return;
 const kids=[...list.children].filter(c=>c!==ph&&c.classList.contains('block'));
 const after=kids.find(c=>{const q=c.getBoundingClientRect();return e.clientY<q.top+q.height/2});
 if(after!==ph.nextSibling||ph.parentNode!==list)list.insertBefore(ph,after||null);
}
document.addEventListener('pointermove',move);
function drop(){
 if(!drag)return;const{el,ph,fromLib,home,trash,cond}=drag;drag=null;clearErr();clearSel();
 document.querySelectorAll('.cond.hot').forEach(x=>x.classList.remove('hot'));document.body.classList.remove('dragging-sensor');
 document.body.classList.remove('dragging');trashEl.classList.remove('hot');
 const clean=()=>{el.classList.remove('ghost');el.style.cssText=''};
 if(trash){el.remove();ph.remove();sound('del');return}
 if(el.classList.contains('sensor')){
  if(cond){cond.innerHTML='';clean();cond.appendChild(el);landed(el);sound(fromLib?'add':'move')}
  else if(!fromLib){clean();home.parent.appendChild(el)}
  else el.remove();
  return}
 if(ph.parentNode){clean();ph.replaceWith(el);landed(el);sound(fromLib?'add':'move')}
 else if(!fromLib){clean();home.parent.insertBefore(el,home.next&&home.next.parentNode===home.parent?home.next:null)}
 else el.remove();
}

/* ---------- running ---------- */
let running=false,timer=null,sess=null;
function* run(arr,hl,depth){
 for(const c of arr){
  const el=c.el||hl;
  if(c.t==='for'){const n=Math.max(1,Math.min(99,c.n||1));for(let i=0;i<n;i++){if(++ops>200000)throw Error('long');if(c.el)yield{t:'loop',el:c.el,cnt:n-i};yield*run(c.ch,el,depth)}if(c.el)yield{t:'loop',el:c.el,cnt:0}}
  else if(c.t==='call'){if(depth<20&&customs[c.id])yield*run(customs[c.id].body,el,depth+1)}
  else if(c.t==='if'){if(yield{t:'cond',el,cond:c.cond})yield*run(c.ch,el,depth)}
  else if(c.t==='while'){
   while(true){if(++ops>200000)throw Error('long');
    if(!(yield{t:'cond',el,cond:c.cond}))break;
    const before=acount;yield*run(c.ch,el,depth);
    if(acount===before){yield{t:'stuck',el};return}}}
  else yield{t:c.t,el,n:c.n}}
}
function canGo(){
 const nx=R.x+DX[R.d],ny=R.y+DY[R.d],c=(grid[ny]||[])[nx]||'W';
 if(c==='W'||c==='L')return false;
 if(boxes.has(nx+','+ny)){const bx=nx+DX[R.d],by=ny+DY[R.d],t=(grid[by]||[])[bx];if(!(t===' '||t==='D'||t==='O')||boxes.has(bx+','+by))return false}
 return true}

function end(m){running=false;clearInterval(timer);sess=null;clearHi();updRun();if(m)say(m)}
let bad=false,won=false,acount=0;
function setCnt(el,v){const e=el&&el.querySelector(':scope > .hd > .cnt');if(!e)return;e.textContent='⏳ '+v;e.classList.remove('pop');void e.offsetWidth;e.style.animationDuration=Math.max(.1,Math.min(.45,1.05/speed))+'s';e.classList.add('pop')}
function clearErr(){document.querySelectorAll('.block.err,.block.ok').forEach(e=>e.classList.remove('err','ok'));document.querySelectorAll('.cnt').forEach(e=>e.textContent='')}
function step(a){acount++;
 if(a.t==='rot'){R.d=(R.d+3)%4;angle-=90;return true}
 const nx=R.x+DX[R.d],ny=R.y+DY[R.d],c=(grid[ny]||[])[nx]||'W';
 if(a.t==='use'){
  const it=inv[(a.n|0)-1];
  if(!it){say(tr('ms.slot',a.n));bad=true}
  else if(it==='🔑'&&c==='L'){grid[ny][nx]='O';inv[a.n-1]=null;ui();say(tr('ms.open'))}
  else{say(tr('ms.nothing'));bad=true}
  return true}
 if(c==='W'||c==='L'){say(tr(c==='L'?'ms.locked':'ms.wall'));bad=true;return false}
 const k=nx+','+ny;
 if(boxes.has(k)){const bx=nx+DX[R.d],by=ny+DY[R.d],t=(grid[by]||[])[bx];
  if(!(t===' '||t==='D'||t==='O')||boxes.has(bx+','+by)){say(tr('ms.stuck'));bad=true;return false}
  boxes.delete(k);boxes.add(bx+','+by)}
 R.x=nx;R.y=ny;
 if(c==='k'){const i=inv.indexOf(null);if(i<0)say(tr('ms.invfull'));else{grid[ny][nx]=' ';inv[i]='🔑';ui();say(tr('ms.key',i+1))}}
 if(c==='e'){say(tr('ms.win'));won=true;return false}
 return true;
}
function start(){
 if(sess)return true;setSelMode(false);reset();clearErr();ops=0;acount=0;
 const arr=ser(main,true);
 if(!arr.length){say(tr('ms.empty'));return false}
 sess={gen:run(arr,null,0),res:undefined,n:0};return true;
}
function tick(){
 clearHi();sonar=null;let r;
 try{r=sess.gen.next(sess.res)}catch(e){end(tr('ms.toolong'));return}
 if(r.done){end(tr('ms.fin'));return}
 const a=r.value;sess.n++;sess.res=undefined;bad=false;let ok=true;
 if(a.el)a.el.classList.add('active');
 if(a.t==='cond'){
  const v=evalCond(a.cond);
  if(v===null){say(tr('ms.nocond'));bad=true;ok=false}
  else{sess.res=v;ping(a.cond);say(condText(a.cond)+'? '+tr(v?'ui.yes':'ui.no'))}}
 else if(a.t==='loop')setCnt(a.el,a.cnt);
 else if(a.t==='stuck'){say(tr('ms.loopstuck'));bad=true;ok=false}
 else ok=step(a);
 if(a.el){a.el.classList.add('ok');for(let p=a.el.parentElement&&a.el.parentElement.closest('.block');p;p=p.parentElement&&p.parentElement.closest('.block'))p.classList.add('ok')}
 if(bad&&a.el)a.el.classList.add('err');
 if(!ok){end();if(won){won=false;setTimeout(showWin,700)}}
 else if(sess.n>5000)end(tr('ms.toolong'));
 else if(!running)say(tr('ms.step',sess.n));
}
document.getElementById('run').onclick=()=>{
 if(running){pause();return}
 if(!start())return;running=true;updRun();say(tr('ms.run'));
 timer=setInterval(tick,450/speed);
};

let levels,curLevel;
function saveLevels(){LS.set('karol.levels',JSON.stringify(levels));LS.set('karol.level',curLevel)}
function normLevel(l,i){
 if(!l||typeof l!=='object')throw Error('Level '+i+' is not an object');
 let m=l.map;if(typeof m==='string')m=m.split('\n');
 if(!Array.isArray(m)||!m.length||m.some(r=>typeof r!=='string'))throw Error('Level '+i+': map must be an array of strings');
 if(m.join('').split('K').length!==2)throw Error('Level '+i+': map needs exactly one K (robot)');
 return{id:String(l.id||('level-'+Date.now()+'-'+i)),name:String(l.name||('Level '+(i+1))),map:m}}

 soundOn=LS.get('karol.sound')!=='off';

 if(LS.get('karol.ver')==='5')levels=stored.length?stored:defs;
 else{levels=defs.concat(stored.filter(l=>!defs.some(d=>d.id===l.id)));LS.set('karol.ver','5')}
 loadLevel(LS.get('karol.level'));say(tr('ms.ready'))}

 console.log('Imported '+add.length+' level(s)');return add.length}
